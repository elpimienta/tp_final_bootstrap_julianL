<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rumbeando para el Litoral - Chamamé por FM La Colonia 92.9 con La Negra Ceballos">
    <title>Rumbeando Para el Litoral</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light m-0 p-0">
    <a href="https://wa.me/543704403617" class="btn-wsp" target="_blank" rel="noopener noreferrer">
        <img src="./multimedia/btnwsp.png" alt="Contactar por WhatsApp">
    </a>

    <header class="row text-center m-0">
        <h1 class="bg-success text-white text-uppercase p-2">Rumbeando para el litoral</h1>
        <h2 class="bg-warning text-dark fs-4">Un espacio para disfrutar del mejor chamamé</h2>
        <div class="row m-0 p-0">
            <p class="col-6 bg-success text-white bg-opacity-25 m-0 p-2 fw-bold">Por la 92.9</p>
            <p class="col-6 bg-success text-white bg-opacity-10 m-0 p-2 fw-bold">La Colonia FM</p>
        </div>
    </header>

    <nav class="navbar bg-secondary navbar-expand-md">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-target="#menu" data-bs-toggle="collapse" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="navbar-collapse collapse justify-content-end" id="menu">
                <ul class="nav">
                    <li class="nav-item text-uppercase"><a class="menu-item" href="#pedido">Hace Tu Pedido</a></li>
                    <li class="nav-item text-uppercase"><a class="menu-item" href="#nosotros">Nosotros</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="row m-0">
        <section class="col-md-6 text-center mt-3">
            <h3 class="text-dark text-capitalize">los más pedidos esta semana</h3>
            <div class="accordion" id="accordionExample">
                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button bg-warning text-uppercase" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true">Hermanos Barrios</button>
                    </h2>
                    <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
                        <div class="accordion-body"><video controls preload="metadata" class="col-12" src="./multimedia/acordeon.mp4" id="videodemo"></video></div>
                    </div>
                </div>
                <div class="accordion-item">
                    <h2 class="accordion-header"><button class="accordion-button collapsed text-uppercase" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo">Los de Mailin</button></h2>
                    <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                        <div class="accordion-body"><video controls preload="metadata" class="col-12" src="./multimedia/fiesta.mp4"></video></div>
                    </div>
                </div>
                <div class="accordion-item">
                    <h2 class="accordion-header"><button class="accordion-button bg-warning text-uppercase" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree">Conjunto Vera Lucero</button></h2>
                    <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                        <div class="accordion-body"><video controls preload="metadata" class="col-12" src="./multimedia/gaucho.mp4"></video></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="col-md-6 mt-3">
            <h2>Nuestros Sponsors</h2>
            <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                  <div class="carousel-item active"><img src="./multimedia/esponsoraguada.png" class="d-block w-100" alt="Aguada"></div>
                  <div class="carousel-item"><img src="./multimedia/esponsortambor.png" class="d-block w-100" alt="Tambor"></div>
                  <div class="carousel-item"><img src="./multimedia/esponsortesla.jpg" class="d-block w-100" alt="Tesla"></div>
                  <div class="carousel-item"><img src="./multimedia/esponsorcoca.jpeg" class="d-block w-100" alt="Coca Cola"></div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
            </div>
        </section>
    </div>

    <section id="pedido" class="mt-4 container">
        <h3>Hacé tu pedido</h3>
        <form class="row" action="https://formspree.io/f/xqkrkpbn" method="POST">
            <div class="col-12 col-md-6 mb-2">
                <label for="email" class="form-label">Tu Email</label>
                <input id="email" class="form-control" type="email" name="email" placeholder="tu@email.com" required>
            </div>
            <div class="col-12 col-md-6 mb-2">
                <label for="tema" class="form-label">Elegí un tema</label>
                <select class="form-select" name="tema" id="tema">
                    <option value="tema_1">Tu Pañuelo</option>
                    <option value="tema_2">Camino a 3 Palmas</option>
                    <option value="tema_3">Verdulera</option>
                </select>
            </div>
            <div class="col-12">
                <label for="mensaje" class="form-label">Tu Mensaje</label>
                <textarea class="form-control" name="message" id="mensaje" placeholder="Quiero escuchar..." rows="3" required></textarea>
            </div>
            <div class="col-12"><button class="btn btn-lg btn-primary mt-2 w-100" type="submit">Enviar</button></div>
        </form>
    </section>

    <footer id="nosotros" class="row text-center justify-content-center p-3 mt-4 bg-dark text-white m-0">
        <h4 class="col-4 datosRadio">92.9 mhz</h4>
        <h4 class="col-4 datosRadio">De 16 a 18 hs</h4>
        <h4 class="col-4 datosRadio">Locución: La Negra Ceballos</h4>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
